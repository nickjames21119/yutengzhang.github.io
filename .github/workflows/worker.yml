name: Deploy complete site and visitor service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-academic-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment settings
        env:
          VISITOR_SECRET: ${{ secrets.VISITOR_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$DATABASE_ID" || { echo "Missing CLOUDFLARE_D1_DATABASE_ID variable"; exit 1; }
          test ${#VISITOR_SECRET} -ge 32 || { echo "VISITOR_SECRET must contain at least 32 random characters"; exit 1; }
      - name: Configure and build
        run: |
          python scripts/configure_visitors.py --database-id "$DATABASE_ID"
          python scripts/build.py --site-url "$SITE_URL"
      - name: Run regression checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Apply database migration
        run: npx --yes wrangler@4 d1 migrations apply yuteng-visitors --remote
      - name: Deploy assets and API
        run: npx --yes wrangler@4 deploy
      - name: Set private HMAC secret
        env:
          VISITOR_SECRET: ${{ secrets.VISITOR_SECRET }}
        run: |
          python -c 'import json,os; print(json.dumps({"VISITOR_SECRET":os.environ["VISITOR_SECRET"]}))' | npx --yes wrangler@4 secret bulk
