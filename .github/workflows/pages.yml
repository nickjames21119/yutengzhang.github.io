name: Build and deploy academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static files
        env:
            SITE_URL: https://yutengzhang.com
        run: python scripts/build.py --site-url "$SITE_URL"
      - name: Run standard-library checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node for JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scene, visitor client and SQLite-backed API
        run: node --test tests/*.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
